site_name: Rising Ruby / Sinking Sapphire Wiki
site_url: !ENV [SITE_URL, "https://stephenalvin.github.io/RRSS/"]  # npm run dev overrides this so the dev server serves at /
site_description: A fan-made wiki for Drayano's Pokémon Rising Ruby and Sinking Sapphire ROM hacks, generated from the official documentation.
site_author: Stephen Alvin
repo_url: https://github.com/StephenAlvin/RRSS
repo_name: StephenAlvin/RRSS
edit_uri: ""
exclude_docs: |
  SUMMARY.md
copyright: Fan-made wiki. Rising Ruby / Sinking Sapphire by Drayano. Pokémon is © Nintendo, Creatures Inc. and GAME FREAK inc.

theme:
  name: material
  language: en
  logo: img/items/poke-ball.png
  favicon: img/items/poke-ball.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - toc.follow

# Regenerate pages from the documentation before each build, and rebuild when the sources change.
hooks:
  - tools/mkdocs_hook.py
watch:
  - tools
  - Documentation

plugins:
  - search:
      lang: en
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js
  - javascripts/tablesort.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StephenAlvin/RRSS
      name: Source on GitHub
